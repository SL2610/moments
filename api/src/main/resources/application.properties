spring.application.name=api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

auth.jwt.secret=${JWT_SECRET}
auth.jwt.issuer=${JWT_ISSUER:grabpic}
auth.allow-registration=${ALLOW_REGISTRATION:true}
auth.admin-email=${ADMIN_EMAIL:}
auth.admin-password=${ADMIN_PASSWORD:}

storage.path=${STORAGE_PATH:/data/photos}
storage.view-url-secret=${VIEW_URL_SECRET}
storage.import-path=${IMPORT_PATH:/import}

photos.max-size-mb=${PHOTO_MAX_SIZE_MB:30}
photos.max-per-user=${MAX_PHOTOS_PER_USER:10000}

wedding.guest-password=${GUEST_PASSWORD:}
wedding.event-name=${EVENT_NAME:Your Names Here}

spring.servlet.multipart.max-file-size=${PHOTO_MAX_SIZE_MB:30}MB
spring.servlet.multipart.max-request-size=${PHOTO_MAX_SIZE_MB:30}MB

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=500ms
spring.data.redis.lettuce.shutdown-timeout=200ms

turnstile.secret=${TURNSTILE_SECRET:}
turnstile.allowed-hostnames=${TURNSTILE_ALLOWED_HOSTNAMES:}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server.tomcat.max-swallow-size=-1

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000

server.tomcat.threads.max=100
server.tomcat.threads.min-spare=5
server.tomcat.connection-timeout=10000

server.server-header=
server.tomcat.accesslog.enabled=false

server.forward-headers-strategy=NATIVE
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
